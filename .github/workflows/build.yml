name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"

      - name: Prepare config and build
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          chmod +x build.sh
          
          # Jeśli plik config.properties nie istnieje, stwórz go z szablonu.
          # Jeśli już go dodałeś, ten krok nie nadpisze Twoich danych.
          if [ ! -f config.properties ]; then
            if [ -f config.example.properties ]; then
              cp config.example.properties config.properties
            else
              touch config.properties
            fi
          fi
          
          ./build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-APK
          path: "*.apk"
